<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>solarhub</title>
<meta name="description" content="free projects and games, playable in the browser">
<link id="originalFavicon" rel="icon" type="image/png" href="images/solarhub.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #201e1c;
    --panel: #29241f;
    --ink: #ece6dc;
    --muted: #8f867b;
    --red: #b6402c;
    --red-soft: #6d2c22;
    --line: #3b3632;
    --accent: #b6402c;
    --ease: cubic-bezier(.4,0,.2,1);
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Space Grotesk", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; }
  button{ font-family: inherit; cursor: pointer; }

  :focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* ---------- masthead ---------- */
  .masthead{
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 900px;
    margin: 0 auto;
    padding: 18px 24px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }

  .masthead .brand{
    font-family: "Fraunces", serif;
    font-weight: 500;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
  }

  .masthead nav{
    display: flex;
    align-items: center;
    gap: 22px;
    font-size: 0.82rem;
  }

  .masthead nav a{
    text-decoration: none;
    color: var(--muted);
    position: relative;
    padding-bottom: 2px;
    transition: color 0.2s var(--ease);
  }
  .masthead nav a::after{
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 1px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s var(--ease);
  }
  .masthead nav a:hover{ color: var(--ink); }
  .masthead nav a:hover::after{ transform: scaleX(1); }

  .masthead .settings-btn{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.78rem;
    padding: 7px 14px;
    border-radius: 3px;
    transition: border-color 0.2s var(--ease), color 0.2s var(--ease);
  }
  .masthead .settings-btn:hover{ border-color: var(--accent); color: var(--ink); }

  /* ---------- sections ---------- */
  section{ display: none; }
  section.active{ display: block; }

  .hero{
    max-width: 900px;
    margin: 0 auto;
    padding: 80px 24px 56px;
  }

  .hero h1{
    font-family: "Fraunces", serif;
    font-weight: 500;
    font-size: clamp(2.1rem, 6vw, 3.4rem);
    line-height: 1.08;
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }

  .hero p{
    max-width: 46ch;
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
    margin: 0 0 30px;
  }

  .hero button{
    background: var(--accent);
    color: var(--bg);
    border: none;
    font-weight: 500;
    font-size: 0.9rem;
    padding: 12px 22px;
    border-radius: 3px;
    transition: filter 0.2s var(--ease), transform 0.2s var(--ease);
  }
  .hero button:hover{ filter: brightness(1.12); transform: translateY(-1px); }

  .wrap{ max-width: 900px; margin: 0 auto; padding: 0 24px 80px; }

  .roll-head{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-top: 1px solid var(--red-soft);
    padding-top: 8px;
    margin: 40px 0 18px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .roll-head:first-of-type{ margin-top: 0; }

  /* ---------- featured strip ---------- */
  .featured{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }

  .featured .card{
    display: block;
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    background: var(--panel);
    transition: border-color 0.25s var(--ease), transform 0.25s var(--ease);
  }
  .featured .card:hover{ border-color: var(--accent); transform: translateY(-3px); }

  .featured .card img{
    width: 100%;
    height: 130px;
    object-fit: cover;
    display: block;
    filter: grayscale(0.15);
    transition: filter 0.3s var(--ease);
  }
  .featured .card:hover img{ filter: grayscale(0); }

  .featured .card .body{ padding: 14px 16px 16px; }
  .featured .card h3{
    font-family: "Fraunces", serif;
    font-weight: 500;
    font-size: 1.05rem;
    margin: 0 0 4px;
  }
  .featured .card p{
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.4;
    margin: 0;
  }

  /* ---------- full list, row style ---------- */
  ol.rows{ list-style: none; margin: 0; padding: 0; }
  ol.rows li{ border-bottom: 1px solid var(--line); }

  ol.rows li a{
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    padding: 12px 6px;
    position: relative;
    isolation: isolate;
    border-radius: 2px;
  }

  ol.rows li a .n{
    font-size: 0.7rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    width: 18px;
    flex: none;
    transition: color 0.25s var(--ease);
  }

  ol.rows li a img{
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 3px;
    flex: none;
  }

  ol.rows li a .info{ flex: 1; min-width: 0; }
  ol.rows li a .name{
    font-family: "Fraunces", serif;
    font-weight: 500;
    font-size: 1.05rem;
    line-height: 1.25;
    transition: color 0.25s var(--ease);
  }
  ol.rows li a .note{
    color: var(--muted);
    font-size: 0.78rem;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.25s var(--ease);
  }

  ol.rows li a::before{
    content: "";
    position: absolute;
    inset: 0;
    background: var(--accent);
    transform-origin: left;
    transform: scaleX(0);
    transition: transform 0.4s var(--ease);
    z-index: -1;
    border-radius: 2px;
  }
  ol.rows li a:hover::before,
  ol.rows li a:focus-visible::before{ transform: scaleX(1); }
  ol.rows li a:hover .n, ol.rows li a:hover .name, ol.rows li a:hover .note,
  ol.rows li a:focus-visible .n, ol.rows li a:focus-visible .name, ol.rows li a:focus-visible .note{
    color: var(--bg);
    opacity: 0.85;
  }

  @media (max-width: 560px){
    ol.rows li a .note{ display: none; }
  }

  /* ---------- player ---------- */
  #player{
    margin-top: 40px;
    position: relative;
    width: 100%;
    height: 560px;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    display: none;
  }
  #player.active{ display: block; }
  #player iframe{ width: 100%; height: 100%; border: 0; display: block; }

  #fsBtn{
    position: absolute;
    bottom: 12px; right: 12px;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    opacity: 0.65;
    transition: opacity 0.2s var(--ease), background 0.2s var(--ease);
  }
  #player:hover #fsBtn{ opacity: 1; background: rgba(0,0,0,0.75); }
  #fsBtn svg{ width: 18px; height: 18px; stroke: var(--ink); }

  /* ---------- settings ---------- */
  .modal-backdrop{
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 40;
    align-items: center;
    justify-content: center;
  }
  .modal-backdrop.active{ display: flex; }

  .modal{
    width: min(340px, 90vw);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 24px;
    position: relative;
  }
  .modal h2{
    font-family: "Fraunces", serif;
    font-weight: 500;
    font-size: 1.2rem;
    margin: 0 0 18px;
  }
  .modal .close{
    position: absolute; top: 14px; right: 16px;
    background: none; border: none;
    color: var(--muted);
    font-size: 1.2rem;
    line-height: 1;
  }
  .modal .close:hover{ color: var(--ink); }

  .modal p.label{
    font-size: 0.78rem;
    color: var(--muted);
    margin: 0 0 10px;
  }

  .swatches{
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }
  .swatch{
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid transparent;
    transition: border-color 0.2s var(--ease), transform 0.2s var(--ease);
  }
  .swatch:hover{ transform: scale(1.1); }
  .swatch.active{ border-color: var(--ink); }

  /* ---------- footer ---------- */
  .colophon{
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 24px 44px;
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 0.74rem;
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>

<header class="masthead">
  <span class="brand">SolarHub</span>
  <nav>
    <a href="#" data-section="home">home</a>
    <a href="#" data-section="projects">projects</a>
    <button class="settings-btn" id="openSettings">settings</button>
  </nav>
</header>

<section id="home" class="active">
  <div class="hero">
    <h1>free projects to play in your browser</h1>
    <p>no downloads, no accounts. pick something from the list and it loads right here on the page.</p>
    <button data-goto="projects">view projects</button>
  </div>
</section>

<section id="projects">
  <div class="wrap">

    <div class="roll-head"><span>featured</span></div>
    <div class="featured" id="featured"></div>

    <div id="player">
      <iframe id="gameFrame" src=""></iframe>
      <button id="fsBtn" title="fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 00-2 2v3m0 8v3a2 2 0 002 2h3m8-16h3a2 2 0 012 2v3m0 8v3a2 2 0 01-2 2h-3"/>
        </svg>
      </button>
    </div>

    <div class="roll-head">
      <span>all projects</span>
      <span id="count"></span>
    </div>
    <ol class="rows" id="allRows"></ol>

  </div>
</section>

<footer class="colophon">
  <span>© 2026 SolarHub</span>
  <span>part of the <a href="https://liaisdagreatest.github.io/" style="color:var(--muted);border-bottom:1px solid var(--line);text-decoration:none;">liaisdagreatest</a> network</span>
</footer>

<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <button class="close" id="closeSettings">&times;</button>
    <h2>settings</h2>
    <p class="label">accent color</p>
    <div class="swatches" id="swatches"></div>
  </div>
</div>

<script>
  // ---- data: add new projects here ----
  const projects = [
    { name: "Class of '09", url: "https://zbotvr.github.io/classof09webport/", img: "images/classof09cover.png", note: "the \"rejection\" simulator", featured: true },
    { name: "Class of '09: The Re-Up", url: "https://zbotvr.github.io/classof09thereup/", img: "images/classof09tru.jpg", note: "it's not a sequel, it's the re-up", featured: true },
    { name: "Class of '09: The Flip Side", url: "https://zbotvr.github.io/Class-Of-09-The-Flip-Side/", img: "images/classof09coverflipside.jpg", note: "same simulator, different character", featured: true },
    { name: "Doki Doki Literature Club!", url: "https://zbotvr.github.io/ddlcweb/", img: "images/ddlc.png", note: "a dating sim. ...unless." },
    { name: "Friday Night Funkin'", url: "https://zbotvr.github.io/fridaynightfunkin/", img: "images/fridaynightfunkin.png", note: "beep bop bap" },
    { name: "Minecraft", url: "https://zbotvr.github.io/mc/", img: "images/minecrafteg.png", note: "1.12.2" },
    { name: "NEET Girl Date Night", url: "https://zbotvr.github.io/NEET-Girl-Date-Night/", img: "images/ngdn.png", note: "really good, also it's a date" },
    { name: "Needy Streamer Overload", url: "https://zbotvr.github.io/games/Needy%20Streamer%20Overload.html", img: "images/nso.png", note: "you play as a producer" },
    { name: "Gorilla Tag", url: "https://zbotvr.github.io/games/Gorilla%20Tag.html", img: "images/gtag.webp", note: "monke monke monke" },
    { name: "People Playground", url: "https://zbotvr.github.io/games/People%20Playground.html", img: "images/ppg.jpg", note: "sandbox, genuinely fun" }
  ];

  const accents = ["#b6402c","#2e7d5b","#2f5fb0","#a8579a","#c98a2c","#5c5f66"];

  // ---- nav ----
  const sections = document.querySelectorAll('section');
  function showSection(id){
    sections.forEach(s => s.classList.toggle('active', s.id === id));
  }
  document.querySelectorAll('[data-section]').forEach(el => {
    el.addEventListener('click', e => { e.preventDefault(); showSection(el.dataset.section); });
  });
  document.querySelectorAll('[data-goto]').forEach(el => {
    el.addEventListener('click', () => showSection(el.dataset.goto));
  });

  // ---- render featured ----
  const featuredEl = document.getElementById('featured');
  featuredEl.innerHTML = projects.filter(p => p.featured).map(p => `
    <a class="card" href="#" data-url="${p.url}">
      <img src="${p.img}" alt="${p.name}" loading="lazy">
      <div class="body">
        <h3>${p.name}</h3>
        <p>${p.note}</p>
      </div>
    </a>
  `).join('');

  // ---- render full list ----
  const rowsEl = document.getElementById('allRows');
  rowsEl.innerHTML = projects.map((p, i) => `
    <li>
      <a href="#" data-url="${p.url}">
        <span class="n">${String(i + 1).padStart(2, '0')}</span>
        <img src="${p.img}" alt="" loading="lazy">
        <span class="info">
          <span class="name">${p.name}</span><br>
          <span class="note">${p.note}</span>
        </span>
      </a>
    </li>
  `).join('');
  document.getElementById('count').textContent = String(projects.length).padStart(2, '0') + ' total';

  // ---- player ----
  const player = document.getElementById('player');
  const frame = document.getElementById('gameFrame');

  document.querySelectorAll('[data-url]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      frame.src = el.dataset.url;
      player.classList.add('active');
      player.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });

  document.getElementById('fsBtn').addEventListener('click', () => {
    if (frame.requestFullscreen) frame.requestFullscreen();
    else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
  });

  // ---- settings: accent color only ----
  const modal = document.getElementById('settingsModal');
  document.getElementById('openSettings').addEventListener('click', () => modal.classList.add('active'));
  document.getElementById('closeSettings').addEventListener('click', () => modal.classList.remove('active'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('active'); });

  const swatchesEl = document.getElementById('swatches');
  const savedAccent = localStorage.getItem('solarhub-accent') || accents[0];

  function applyAccent(hex){
    document.documentElement.style.setProperty('--accent', hex);
    document.documentElement.style.setProperty('--red-soft', hex + '55');
    localStorage.setItem('solarhub-accent', hex);
    document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.color === hex));
  }

  swatchesEl.innerHTML = accents.map(c => `<button class="swatch" style="background:${c}" data-color="${c}" aria-label="set accent ${c}"></button>`).join('');
  swatchesEl.querySelectorAll('.swatch').forEach(btn => {
    btn.addEventListener('click', () => applyAccent(btn.dataset.color));
  });
  applyAccent(savedAccent);
</script>

</body>
</html>
